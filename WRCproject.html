    // 인메모리 폴백 저장소: localStorage 접근 실패 시 사용
    const memoryStore = { technicians: [], reviews: [], users: [], posts: [], adSlots: [] };
    // DB: localStorage 기반 간단한 Key-Value 데이터베이스 래퍼
    // wrc_v8_{key} 형태로 저장하여 버전 충돌 방지
    const DB = {
      // 데이터 조회: localStorage → 실패 시 memoryStore 반환
      get(key) {
        try { const data = localStorage.getItem(`wrc_v8_${key}`); return data ? JSON.parse(data) : (memoryStore[key] || []); } 
        catch (e) { return memoryStore[key] || []; }
      },
      // 데이터 저장: memoryStore와 localStorage 동시 업데이트
      set(key, val) {
        try { memoryStore[key] = val; localStorage.setItem(`wrc_v8_${key}`, JSON.stringify(val)); } 
        catch (e) { memoryStore[key] = val; }
      }
    };
